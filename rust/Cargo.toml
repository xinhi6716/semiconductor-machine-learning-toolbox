[package]
name = "semiconductor-machine-learning-toolbox"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Rust semiconductor measurement preprocessing and descriptive audits"

[[bin]]
name = "smlt"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
regex = "1"
sha2 = "0.10"
libc = "0.2"
bigdecimal = "0.4"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
